<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo MVP - LocalStorage</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide">📦 Mrl Catálogo</h1>
            <button onclick="toggleAdminModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm px-4 py-2 rounded-lg font-medium transition">
                ⚙️ Painel Admin
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
        
        <!-- Barra de Busca e Filtros -->
        <div class="flex flex-col md:flex-row gap-4 mb-8 justify-between items-center">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Buscar produto por nome ou descrição..." 
                oninput="filterProducts()"
                class="w-full md:w-96 px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white"
            >
            
            <div id="categoryFilters" class="flex flex-wrap gap-2 w-full md:w-auto">
                <button onclick="filterCategory('Todos')" class="cat-btn px-4 py-2 text-sm font-medium rounded-lg bg-indigo-600 text-white transition">Todos</button>
            </div>
        </div>

        <!-- Grid de Produtos -->
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Os cards entram via JS -->
        </div>

        <!-- Estado Vazio -->
        <div id="emptyState" class="hidden text-center py-16">
            <p class="text-slate-400 text-lg">Nenhum produto encontrado.</p>
        </div>
    </main>

    <!-- Modal Admin / Cadastro -->
    <div id="adminModal" class="fixed inset-0 bg-black/50 hidden justify-center items-center z-50 p-4">
        <div class="bg-white rounded-xl max-w-lg w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <h2 class="text-xl font-bold mb-4 text-slate-900">Gerenciar Produtos</h2>
            
            <!-- Formulário -->
            <form id="productForm" onsubmit="saveProduct(event)" class="space-y-4 mb-6 border-b pb-6">
                <input type="hidden" id="prodId">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nome do Produto</label>
                    <input type="text" id="prodName" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Preço (R$)</label>
                        <input type="number" step="0.01" id="prodPrice" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Categoria</label>
                        <input type="text" id="prodCategory" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">URL da Imagem</label>
                    <input type="url" id="prodImage" placeholder="https://exemplo.com/foto.jpg" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Descrição</label>
                    <textarea id="prodDesc" rows="2" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500"></textarea>
                </div>
                <div class="flex justify-end gap-2">
                    <button type="button" onclick="resetForm()" class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium">Salvar Produto</button>
                </div>
            </form>

            <!-- Lista de exclusão rápida -->
            <h3 class="font-bold text-sm text-slate-700 mb-2">Itens Cadastrados</h3>
            <div id="adminProductList" class="space-y-2 max-h-48 overflow-y-auto">
                <!-- Lista via JS -->
            </div>

            <button onclick="toggleAdminModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 font-bold text-xl">✕</button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-sm text-slate-500 mt-auto">
        Feito com ⚡ por Marx • Rodando no GitHub Pages
    </footer>

    <!-- Script de Lógica -->
    <script>
        // Dados iniciais de exemplo se o localStorage estiver vazio
        const defaultProducts = [
            { id: 1, name: "Cadeira Gamer RGB", price: 899.90, category: "Móveis", image: "https://images.unsplash.com/photo-1598550476439-6847785fcea6?w=500&auto=format&fit=crop&q=60", desc: "Cadeira ergonômica com iluminação LED customizável." },
            { id: 2, name: "Teclado Mecânico 60%", price: 299.00, category: "Periféricos", image: "https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=500&auto=format&fit=crop&q=60", desc: "Switch Red, compacto e com conexão Bluetooth/Cabo." },
            { id: 3, name: "Mousepad Grande Estampado", price: 79.90, category: "Acessórios", image: "https://images.unsplash.com/photo-1615663245857-ac93bb7c39e7?w=500&auto=format&fit=crop&q=60", desc: "Superfície speed ideal para alta precisão." }
        ];

        let products = JSON.parse(localStorage.getItem('mrl_catalog_products')) || defaultProducts;
        let currentCategory = 'Todos';

        function saveToStorage() {
            localStorage.setItem('mrl_catalog_products', JSON.stringify(products));
        }

        function renderProducts(itemsToRender = products) {
            const grid = document.getElementById('productGrid');
            const emptyState = document.getElementById('emptyState');
            grid.innerHTML = '';

            if (itemsToRender.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            itemsToRender.forEach(p => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col hover:shadow-md transition";
                card.innerHTML = `
                    <div class="h-48 overflow-hidden bg-slate-100 relative">
                        <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover">
                        <span class="absolute top-2 right-2 bg-slate-900/70 backdrop-blur-sm text-white text-xs px-2.5 py-1 rounded-full font-medium">${p.category}</span>
                    </div>
                    <div class="p-4 flex flex-col flex-grow">
                        <h3 class="font-bold text-slate-800 text-lg mb-1">${p.name}</h3>
                        <p class="text-slate-500 text-sm mb-4 flex-grow line-clamp-2">${p.desc || 'Sem descrição.'}</p>
                        <div class="flex items-center justify-between mt-auto">
                            <span class="text-indigo-600 font-bold text-lg">R$ ${Number(p.price).toFixed(2)}</span>
                            <a href="https://wa.me/5500000000000?text=Olá! Tenho interesse em comprar: *${encodeURIComponent(p.name)}* (R$ ${Number(p.price).toFixed(2)})" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-2 rounded-lg font-medium transition">
                                💬 Comprar
                            </a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function renderCategories() {
            const container = document.getElementById('categoryFilters');
            const categories = ['Todos', ...new Set(products.map(p => p.category))];
            
            container.innerHTML = categories.map(cat => `
                <button onclick="filterCategory('${cat}')" class="cat-btn px-4 py-2 text-sm font-medium rounded-lg ${currentCategory === cat ? 'bg-indigo-600 text-white' : 'bg-white border border-slate-300 text-slate-700 hover:bg-slate-100'} transition">
                    ${cat}
                </button>
            `).join('');
        }

        function filterCategory(cat) {
            currentCategory = cat;
            renderCategories();
            filterProducts();
        }

        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = products.filter(p => {
                const matchesCategory = currentCategory === 'Todos' || p.category === currentCategory;
                const matchesQuery = p.name.toLowerCase().includes(query) || p.desc.toLowerCase().includes(query);
                return matchesCategory && matchesQuery;
            });
            renderProducts(filtered);
        }

        function toggleAdminModal() {
            const modal = document.getElementById('adminModal');
            modal.classList.toggle('hidden');
            modal.classList.toggle('flex');
            renderAdminList();
        }

        function renderAdminList() {
            const list = document.getElementById('adminProductList');
            if (products.length === 0) {
                list.innerHTML = `<p class="text-slate-400 text-xs">Nenhum produto cadastrado.</p>`;
                return;
            }
            list.innerHTML = products.map(p => `
                <div class="flex justify-between items-center bg-slate-50 p-2 rounded-lg border text-sm">
                    <span class="font-medium truncate max-w-[200px]">${p.name}</span>
                    <div class="flex gap-2">
                        <button onclick="editProduct(${p.id})" class="text-indigo-600 hover:underline text-xs font-medium">Editar</button>
                        <button onclick="deleteProduct(${p.id})" class="text-rose-600 hover:underline text-xs font-medium">Excluir</button>
                    </div>
                </div>
            `).join('');
        }

        function saveProduct(e) {
            e.preventDefault();
            const id = document.getElementById('prodId').value;
            const name = document.getElementById('prodName').value;
            const price = parseFloat(document.getElementById('prodPrice').value);
            const category = document.getElementById('prodCategory').value;
            const image = document.getElementById('prodImage').value;
            const desc = document.getElementById('prodDesc').value;

            if (id) {
                // Editar
                products = products.map(p => p.id == id ? { id: Number(id), name, price, category, image, desc } : p);
            } else {
                // Criar novo
                const newId = products.length > 0 ? Math.max(...products.map(p => p.id)) + 1 : 1;
                products.push({ id: newId, name, price, category, image, desc });
            }

            saveToStorage();
            resetForm();
            renderCategories();
            filterProducts();
            renderAdminList();
        }

        function editProduct(id) {
            const p = products.find(item => item.id === id);
            if (!p) return;
            document.getElementById('prodId').value = p.id;
            document.getElementById('prodName').value = p.name;
            document.getElementById('prodPrice').value = p.price;
            document.getElementById('prodCategory').value = p.category;
            document.getElementById('prodImage').value = p.image;
            document.getElementById('prodDesc').value = p.desc;
        }

        function deleteProduct(id) {
            if (confirm("Tem certeza que deseja excluir este produto?")) {
                products = products.filter(p => p.id !== id);
                saveToStorage();
                renderCategories();
                filterProducts();
                renderAdminList();
            }
        }

        function resetForm() {
            document.getElementById('productForm').reset();
            document.getElementById('prodId').value = '';
        }

        // Inicialização ao carregar a página
        renderCategories();
        renderProducts();
    </script>
</body>
</html>
